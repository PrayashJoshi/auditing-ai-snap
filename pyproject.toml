[project]
name = "auditing-ai-snap"
version = "0.1.0"
description = "Jupyter Python notebooks for the Apart Research AI x Epistemics Sprint (Nov 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29.0",
    "jupytext>=1.16.0",
    "nbconvert>=7.16.0",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.9.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "rdata>=0.11",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapqc"]
